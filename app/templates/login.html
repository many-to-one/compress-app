<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title data-i18n="login_badge">Login</title>

    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>

<div class="auth-container">

    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <form class="auth-card" id="loginForm" method="POST" action="/auth/login">

        <div class="badge" data-i18n="login_badge">
            Login Page
        </div>

        <h1 data-i18n="login_title">Welcome Back</h1>

        <p data-i18n="login_subtitle">
            Login and generate your JWT access token.
        </p>
        
        <div class="input-group">
            <label data-i18n="login_email_label">Email</label>
            <input
                type="email"
                id="email"
                placeholder="hello@example.com"
                data-i18n-placeholder="login_email_placeholder"
                required
            >
        </div>

        <div class="input-group">
            <label data-i18n="login_password_label">Password</label>
            <input
                type="password"
                id="password"
                placeholder="••••••••"
                data-i18n-placeholder="login_password_placeholder"
                required
            >
        </div>

        <button type="submit" data-i18n="login_button">Login</button>

        <button class="btn google-btn" onclick="loginWithGoogle()">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.02 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.5 24.5c0-1.57-.15-3.09-.43-4.5H24v9h12.85c-.56 2.96-2.26 5.48-4.78 7.16l7.45 5.79C43.82 37.52 46.5 31.47 46.5 24.5z"/>
                <path fill="#FBBC05" d="M10.54 28.41A14.47 14.47 0 0 1 9.5 24c0-1.53.26-3.01.72-4.41l-7.98-6.19A23.89 23.89 0 0 0 0 24c0 3.91.93 7.61 2.56 10.91l7.98-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.9-5.79l-7.45-5.79c-2.07 1.39-4.72 2.18-8.45 2.18-6.26 0-11.57-3.52-13.46-8.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            <span data-i18n="login_google"></span></span>
        </button>

        <div class="result" id="result"></div>

        <div class="bottom-text">
            <a href="/forgot_password" data-i18n="login_forgot">Forgot password</a>
        </div>

        <div class="bottom-text">
            <span data-i18n="login_no_account">No account?</span>
            <a href="/register_page" data-i18n="login_register">Register</a>
        </div>

    </form>

</div>

<script src="/static/js/i18n.js"></script>
<script src="/static/js/login.js"></script>

</body>
</html>
