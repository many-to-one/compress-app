<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google" content="notranslate">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>

<div class="auth-container">
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <div class="auth-card">

        <div class="badge" data-i18n="reset_badge">RESET PASSWORD</div>

        <h1 data-i18n="reset_title">Forgot Password</h1>

        <p data-i18n="reset_subtitle">
            Enter your email and we’ll send you a reset link.
        </p>

        <form id="forgotForm">

            <div class="input-group">
                <label data-i18n="reset_email_label">Email</label>
                <input type="email" id="email" required>
            </div>

            <button type="submit" data-i18n="reset_send_btn">
                Send Reset Link
            </button>

            <div class="result" id="result"></div>

            <div class="bottom-text">
                <a href="/login_page" data-i18n="reset_back_to_login">Back to login</a>
            </div>

        </form>
    </div>
</div>

<script src="/static/js/i18n.js"></script>
<script src="/static/js/forgot_password.js"></script>
</body>
</html>
