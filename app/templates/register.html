<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">

    <title data-i18n="register_title">Register</title>

    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>

<div class="auth-container">

    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <form class="auth-card" id="registerForm">

        <div class="badge" data-i18n="register_badge">
            POST /register
        </div>

        <h1 data-i18n="register_title">Create Account</h1>

        <p data-i18n="register_subtitle">
            Create a new account in your FastAPI backend.
        </p>

        <div class="input-group">
            <label data-i18n="register_email_label">Email</label>
            <input
                type="email"
                id="email"
                placeholder="hello@example.com"
                data-i18n-placeholder="register_email_placeholder"
                required
            >
        </div>

        <div class="input-group">
            <label data-i18n="register_password_label">Password</label>
            <input
                type="password"
                id="password"
                placeholder="••••••••"
                data-i18n-placeholder="register_password_placeholder"
                required
            >
        </div>

        <div class="input-group">
            <label data-i18n="register_confirm_password_label">Confirm Password</label>
            <input
                type="password"
                id="confirm_password"
                placeholder="••••••••"
                data-i18n-placeholder="register_confirm_password_placeholder"
                required
            >
        </div>

        <button type="submit" data-i18n="register_button">
            Register
        </button>

        <div class="result" id="result"></div>

        <div class="bottom-text">
            <span data-i18n="register_have_account">Already have an account?</span>
            <a href="/login_page" data-i18n="register_login">Login</a>
        </div>

    </form>

</div>

<script src="/static/js/i18n.js"></script>
<script src="/static/js/register.js"></script>

</body>
</html>
